name: pulse

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_CONFIG: ${{ secrets.WATCH_CONFIG }}
        run: python3 pulse.py ${{ inputs.test && '--test' || '' }}

      - name: Persist state
        run: |
          git add -A state
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update state"
            git pull --rebase -q || true
            git push
          fi
